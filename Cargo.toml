[workspace]
members = [
    "crates/broker",
    "crates/protocol",        # Kafka compatibility layer only
    "crates/native-protocol", # PulseMQ native protocol
    "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sayan Mahata <sm6881164@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/sayan9168/Sayanox-PulseMQ"
description = "Sayanox PulseMQ — Modern event streaming platform. Compatibility is a feature, not the identity."

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1"
